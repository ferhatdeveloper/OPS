# APK derleme + sürüm kodlu artifact / GitHub Release

name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse pubspec version
        id: version
        run: |
          set -euo pipefail
          VERSION_LINE="$(
            grep -E '^version:' pubspec.yaml \
              | head -1 \
              | tr -d '\r' \
              | awk '{print $2}' \
              | tr -d "\"'"
          )"
          # Windows CRLF / beklenmeyen boşluk temizliği
          VERSION_LINE="$(echo -n "$VERSION_LINE" | tr -d '[:space:]')"
          if [[ ! "$VERSION_LINE" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "pubspec version beklenen formatta değil (x.y.z+code): '${VERSION_LINE}'"
            exit 1
          fi
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          APK_NAME="exfin-ops-${VERSION_NAME}-${VERSION_CODE}.apk"
          # GitHub tag'lerinde '+' sorun çıkarabilir; nokta kullan
          RELEASE_TAG="v${VERSION_NAME}.${VERSION_CODE}"
          {
            echo "version_line=${VERSION_LINE}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "apk_name=${APK_NAME}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Version: name=${VERSION_NAME} code=${VERSION_CODE} apk=${APK_NAME}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Rename APK with version
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          DST="build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}"
          cp "$SRC" "$DST"
          ls -lh "$DST"
          # Android versionCode / versionName doğrulama (aapt varsa)
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$DST" | head -3 || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: EXFIN OPS ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
          body: |
            ## EXFIN OPS APK

            | | |
            |---|---|
            | **versionName** | `${{ steps.version.outputs.version_name }}` |
            | **versionCode** | `${{ steps.version.outputs.version_code }}` |
            | **pubspec** | `${{ steps.version.outputs.version_line }}` |
            | **Dosya** | `${{ steps.version.outputs.apk_name }}` |
            | **applicationId** | `com.example.exfin_ops` |

            Release imzalama: debug keystore (CI'da production keystore yok).
            Production imza için repo secrets: `KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD`.
          files: build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
